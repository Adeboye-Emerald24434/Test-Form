<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2 class="title">Registration Form</h2>
    <form id="registrationForm">
      <!-- Full Name -->
      <div class="input-box">
        <label class="details">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>
      </div>

      <!-- Username -->
      <div class="input-box">
        <label class="details">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required>
      </div>

      <!-- Email -->
      <div class="input-box">
        <label class="details">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <!-- Phone Number -->
      <div class="input-box">
        <label class="details">Phone Number</label>
        <input type="text" id="phone" placeholder="Enter your number" required>
      </div>

      <!-- Password -->
      <div class="input-box">
        <label class="details">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <!-- Confirm Password -->
      <div class="input-box">
        <label class="details">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
      </div>

      <!-- State of Origin -->
      <div class="input-box">
        <label class="details">State of Origin</label>
        <select id="state" required>
          <option value="">-- Select State --</option>
          <option value="Abia">Abia</option>
          <option value="Adamawa">Adamawa</option>
          <option value="Akwa Ibom">Akwa Ibom</option>
          <option value="Anambra">Anambra</option>
          <option value="Bauchi">Bauchi</option>
          <option value="Bayelsa">Bayelsa</option>
          <option value="Benue">Benue</option>
          <option value="Borno">Borno</option>
          <option value="Cross River">Cross River</option>
          <option value="Delta">Delta</option>
          <option value="Ebonyi">Ebonyi</option>
          <option value="Edo">Edo</option>
          <option value="Ekiti">Ekiti</option>
          <option value="Enugu">Enugu</option>
          <option value="Gombe">Gombe</option>
          <option value="Imo">Imo</option>
          <option value="Jigawa">Jigawa</option>
          <option value="Kaduna">Kaduna</option>
          <option value="Kano">Kano</option>
          <option value="Katsina">Katsina</option>
          <option value="Kebbi">Kebbi</option>
          <option value="Kogi">Kogi</option>
          <option value="Kwara">Kwara</option>
          <option value="Lagos">Lagos</option>
          <option value="Nasarawa">Nasarawa</option>
          <option value="Niger">Niger</option>
          <option value="Ogun">Ogun</option>
          <option value="Ondo">Ondo</option>
          <option value="Osun">Osun</option>
          <option value="Oyo">Oyo</option>
          <option value="Plateau">Plateau</option>
          <option value="Rivers">Rivers</option>
          <option value="Sokoto">Sokoto</option>
          <option value="Taraba">Taraba</option>
          <option value="Yobe">Yobe</option>
          <option value="Zamfara">Zamfara</option>
        </select>
      </div>

      <!-- Gender -->
      <div class="input-box gender-details">
        <label class="details">Gender</label>
        <div class="category">
          <label>
            <input type="radio" name="gender" value="Male" required>
            <span>Male</span>
          </label>
          <label>
            <input type="radio" name="gender" value="Female" required>
            <span>Female</span>
          </label>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="button">
        <input type="submit" value="Register">
      </div>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
